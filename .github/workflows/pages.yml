name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', '**/AGENTS.md', 'AGENTS.md', 'CONTRIBUTING.md', 'tools/check*.py', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.14'
      - run: uv sync --locked --group docs
      - run: uv run python tools/check.py docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
